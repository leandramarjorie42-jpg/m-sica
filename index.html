<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Virtual & Gerador de Partituras</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Biblioteca VexFlow para partituras -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>

  <header>
    <h1>🎹 Piano Virtual & Partituras Completas</h1>
    <p>Escolha uma música completa ou peça qualquer música para gerar a partitura!</p>
  </header>

  <div class="container">
    
    <!-- Painel de Seleção e Busca -->
    <div class="card">
      <div class="controls-grid">
        
        <div class="form-group">
          <label for="song-select">Selecione uma Música Completa:</label>
          <select id="song-select">
            <option value="fur_elise">Für Elise (Completa) - Beethoven</option>
            <option value="ode_to_joy">Ode à Alegria (Tema Completo) - Beethoven</option>
            <option value="mario">Super Mario Bros (Tema Principal)</option>
            <option value="twinkle">Brilha, Brilha Estrelinha (Completo)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="song-search">Peça qualquer música ou digite notas:</label>
          <div class="search-box">
            <input type="text" id="song-search" placeholder="Ex: Parabéns pra Você, Moonlight Sonata ou C4 D4 E4...">
            <button id="btn-generate">🎼 Gerar Partitura</button>
          </div>
        </div>

      </div>

      <!-- Controles de Player -->
      <div class="playback-controls">
        <div class="btn-group">
          <button id="btn-play">▶ Tocar Música</button>
          <button id="btn-stop" class="btn-danger">◼ Parar</button>
        </div>

        <div class="tempo-container">
          <label for="tempo">Velocidade (BPM): <span id="bpm-display">120</span></label>
          <input type="range" id="tempo" min="40" max="240" value="120">
        </div>
      </div>
    </div>

    <!-- Área da Partitura Completa -->
    <div class="card">
      <div class="sheet-header">
        <label>Partitura em Tempo Real (Múltiplos Compassos):</label>
        <span id="song-title-display">Für Elise - Beethoven</span>
      </div>
      <div id="sheet-music-container"></div>
    </div>

    <!-- Teclado Visual -->
    <div class="card piano-container">
      <div class="piano" id="piano"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
